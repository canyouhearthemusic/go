<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Последовательность от ключа к значению: хеш, выбор таблицы по верхним битам, выбор группы по H1, параллельное сопоставление H2 в управляющем слове, сравнение ключа в слотах; при отсутствии совпадения — пробирование следующей группы.</desc>
